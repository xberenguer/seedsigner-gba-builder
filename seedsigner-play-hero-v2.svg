<title id="title">SeedSigner Play · monochrome hardware illustration</title><desc id="desc">Original monochrome hardware illustration of SeedSigner Play. Device shape and controls follow cited product references; perspective and materials are illustrative, not to exact scale. The initial screen uses actual Super Mario Bros. gameplay pixels with letterboxing. Clipped screen layers support the credited SeedSigner splash and Home software previews. Screen composites are not physical-device test evidence.</desc>
